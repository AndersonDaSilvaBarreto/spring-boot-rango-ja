spring.application.name=restaurant

# 1. Configuração do PostgreSQL
spring.datasource.url= ${PG_DATABASE_URL}
spring.datasource.username= ${PG_USERNAME}
spring.datasource.password= ${PG_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 2. Configuração do Redis
spring.data.redis.host= ${REDIS_HOST}
spring.data.redis.port= ${REDIS_PORT}
spring.data.redis.password= ${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false
# Se o seu Redis tiver senha:
# spring.data.redis.password=sua_senha

# 3. Configuração do Google SMTP (Email)
spring.mail.host= ${EMAIL_HOST}
spring.mail.port= ${EMAIL_PORT}
spring.mail.username= ${EMAIL_USERNAME}
spring.mail.password= ${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust= ${EMAIL_SSL_TRUST}


# Configurações do Cloudflare R2
# O endpoint geralmente segue o padrão: https://<SEU_ACCOUNT_ID_DA_CLOUDFLARE>.r2.cloudflarestorage.com
cloudflare.r2.endpoint= ${CLOUDFLARE_R2_ENDPOINT}
cloudflare.r2.access-key= ${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key= ${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.bucket-name= ${CLOUDFLARE_R2_BUCKET_NAME}
cloudflare.r2.public-url= ${CLOUDFLARE_R2_PUBLIC_URL}

# 4. Configurações Extras
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

api.security.token.secret= ${API_TOKEN_SECRET}